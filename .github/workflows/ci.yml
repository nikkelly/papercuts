name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      # actions/checkout v4.4.0, pinned to the commit SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0, pinned to the commit SHA
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
